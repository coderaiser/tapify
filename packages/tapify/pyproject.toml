[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tapify"
version = "0.1.0"
description = "TAP-compatible test runner for Python, ported from supertape"
requires-python = ">=3.11"
dependencies = [
    "deepdiff>=7.0",
    "colorama>=0.4; sys_platform == 'win32'",
]

[project.scripts]
tapify = "tapify.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["tapify"]
