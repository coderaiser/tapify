[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "formatter-progress-bar"
version = "0.1.0"
dependencies = ["tapify"]

[tool.uv.sources]
tapify = { workspace = true }

[project.entry-points."tapify.formatter"]
progress-bar = "formatter_progress_bar"

[tool.hatch.build.targets.wheel]
packages = ["formatter_progress_bar"]
