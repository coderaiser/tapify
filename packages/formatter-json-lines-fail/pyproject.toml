[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "formatter-json-lines-fail"
version = "0.1.0"
dependencies = ["tapify"]

[tool.uv.sources]
tapify = { workspace = true }

[project.entry-points."tapify.formatter"]
json-lines-fail = "formatter_json_lines_fail"

[tool.hatch.build.targets.wheel]
packages = ["formatter_json_lines_fail"]