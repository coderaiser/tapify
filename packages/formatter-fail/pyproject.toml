[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "formatter-fail"
version = "0.1.0"
dependencies = ["tapify"]

[tool.uv.sources]
tapify = { workspace = true }

[project.entry-points."tapify.formatter"]
fail = "formatter_fail"

[tool.hatch.build.targets.wheel]
packages = ["formatter_fail"]
